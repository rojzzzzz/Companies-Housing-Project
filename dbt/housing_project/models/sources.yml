            data_tests:
              - 'not_null'
              - relationships:
                  arguments:
                    to: 'source(''staging'', ''company'')'
                    field: 'company_number'
          - name: 'transaction_id'
            data_tests:
              - 'not_null'
          - name: 'currency'
            data_tests:
              - 'not_null'
          - name: 'figure'
            data_tests:
              - 'not_null'
